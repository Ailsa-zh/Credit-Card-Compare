<style>
  /* 主動採用深色主題，避免行動瀏覽器的自動反轉深色模式造成局部元件對比度異常 */
  html{ color-scheme: dark; }

  :root{
    --richart:#fb5b74;
    --richart-soft:rgba(251,91,116,0.14);
    --richart-line:rgba(251,91,116,0.4);

    --unicard:#5b9dff;
    --unicard-soft:rgba(91,157,255,0.14);
    --unicard-line:rgba(91,157,255,0.4);

    --bg:#0b0d12;
    --bg-header:#05060a;
    --surface:#151923;
    --surface-2:#1d222e;
    --surface-3:#272d3c;
    --border:#2a3040;
    --border-strong:#3a4257;

    --ink:#f3f5f9;
    --ink-soft:#b6bcca;
    --ink-faint:#7d8497;

    --gold-bg:#4a3a12;
    --gold-ink:#ffcf5c;
    --cap-ink:#ffb454;

    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --shadow-md:0 6px 20px rgba(0,0,0,0.45);
  }

  *{ box-sizing:border-box; }
  html,body{ background:var(--bg); }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    line-height:1.55;
    -webkit-text-size-adjust:100%;
  }

  header{
    background:linear-gradient(160deg,var(--bg-header) 0%, #10131c 60%, #171c29 100%);
    border-bottom:1px solid var(--border);
    color:var(--ink);
    padding:34px 20px 26px;
    text-align:center;
  }
  header h1{
    margin:0 0 8px;
    font-size:1.45rem;
    font-weight:800;
    letter-spacing:0.2px;
    color:#ffffff;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.88rem;
  }
  .updated{
    display:inline-block;
    margin-top:12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:5px 13px;
    border-radius:999px;
    font-size:0.74rem;
    color:var(--ink-soft);
    letter-spacing:0.2px;
  }

  .container{
    max-width:1000px;
    margin:0 auto;
    padding:18px 16px 60px;
  }

  /* ---------- 搜尋區 ---------- */
  .search-wrap{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--bg);
    padding:14px 0 12px;
  }
  .search-box{
    position:relative;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    transition:border-color .15s, box-shadow .15s;
  }
  .search-box:focus-within{
    border-color:var(--unicard);
    box-shadow:0 0 0 4px rgba(91,157,255,0.15);
  }
  .search-box input{
    width:100%;
    border:none;
    outline:none;
    padding:15px 46px 15px 18px;
    font-size:1rem;
    border-radius:var(--radius-lg);
    background:transparent;
    color:var(--ink);
  }
  .search-box input::placeholder{ color:var(--ink-faint); }
  .search-box .clear-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:var(--surface-3);
    color:var(--ink-soft);
    width:26px;
    height:26px;
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .quick-tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:11px;
  }
  .quick-tag{
    font-size:0.78rem;
    background:var(--surface);
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
    transition:background .12s, border-color .12s, color .12s;
  }
  .quick-tag:hover{
    background:var(--surface-3);
    border-color:var(--border-strong);
    color:var(--ink);
  }

  .summary-line{
    margin:16px 2px 4px;
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .summary-line strong{ color:var(--ink); }

  .best-badge{
    display:inline-block;
    background:var(--gold-bg);
    color:var(--gold-ink);
    font-size:0.68rem;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    margin-left:6px;
    white-space:nowrap;
    vertical-align:middle;
  }

  /* ---------- 結果卡片 ---------- */
  .results{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:10px;
  }
  .result-card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:15px 17px;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--border);
    border-left:4px solid var(--border-strong);

function highlight(text, q){
  if(!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0,idx) + "<mark>" + text.slice(idx, idx+q.length) + "</mark>" + text.slice(idx+q.length);
}

function renderResults(query){
  const q = query.trim();
  if(!q){
    searchResultsWrap.classList.add('hidden');
    browseWrap.classList.remove('hidden');
    return;
  }
  browseWrap.classList.add('hidden');
  searchResultsWrap.classList.remove('hidden');

  const matches = flatRows.filter(r => r.store.toLowerCase().includes(q.toLowerCase()));

  // 去除完全重複列
  const seen = new Set();
  const unique = [];

    const key = r.card+r.plan+r.store+r.rateDisplay;
    if(!seen.has(key)){ seen.add(key); unique.push(r); }
  });

  unique.sort((a,b)=> b.rateNum - a.rateNum);

  if(unique.length === 0){
    summaryLine.innerHTML = `找不到符合「${q}」的通路，換個關鍵字試試？`;

      <div class="result-row-top">
        <span class="plan-tag ${r.card}">${r.plan}</span>
        <span class="card-badge ${r.card}"><span class="dot"></span>${r.cardName}</span>
      </div>
      <div class="result-row-main">
        <span class="store-name">${highlight(r.store,q)}</span>
        <span class="rate-num">${r.rateDisplay}</span>
        ${isBest ? '<span class="best-badge">🏆 回饋較優</span>' : ''}
      </div>
      <div class="cap-line">回饋上限：${r.cap}</div>
      <div class="meta-line">${r.note}</div>
    </div>`;
  }).join("");
}

searchInput.addEventListener('input', (e)=>{
  clearBtn.style.display = e.target.value ? 'flex' : 'none';
  renderResults(e.target.value);
});
clearBtn.addEventListener('click', ()=>{
  searchInput.value = '';
  clearBtn.style.display = 'none';
  renderResults('');
  searchInput.focus();
});

// 快速標籤
const quickTagList = ["Uber Eats","Foodpanda","遠東","LINE Pay","momo",,"蝦皮","全家","7-11","日本","旅遊","百貨","航空","屈臣氏","康是美"];
document.getElementById('quickTags').innerHTML = quickTagList.map(t=>`<span class="quick-tag" data-q="${t}">${t}</span>`).join("");
document.querySelectorAll('.quick-tag').forEach(tag=>{
  tag.addEventListener('click', ()=>{
    searchInput.value = tag.getAttribute('data-q');
    clearBtn.style.display = 'flex';
    renderResults(searchInput.value);
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

/* ============ 瀏覽模式（無搜尋時） ============ */
function renderRichartBrowse(){
  const el = document.getElementById('richartBrowse');
  let html = `<div class="card-header richart"><span class="dot"></span><h2>台新 Richart卡（7+1大刷）</h2></div>`;
  html += `<div class="meta-line" style="margin-bottom:10px;">每日僅能啟用一種方案，以當天最後切換結果適用全天消費；回饋為台新Point，1點=1元。</div>`;
  richartPlans.forEach(p=>{
    html += `
    <div class="plan-block richart">
      <div class="plan-block-head">
        <span class="name">${p.plan}</span>
        <span class="rate">${p.rate}</span>
      </div>
      <div class="cap">回饋上限：${p.cap}｜${p.note}</div>
      <div class="merchant-tags">${p.merchants.map(m=>`<span class="merchant-tag">${m}</span>`).join("")}</div>
    </div>`;
  });
  el.innerHTML = html;
}

function renderUnicardBrowse(){
  const el = document.getElementById('unicardBrowse');
  let html = `<div class="card-header unicard"><span class="dot"></span><h2>玉山 Unicard（百大通路）</h2></div>`;
  html += `<div class="meta-line" style="margin-bottom:10px;">以每月最後一天所選方案計算整月回饋；回饋為玉山e point，1點=1元，效期1年。</div>`;

  html += `<div class="plan-block unicard">
    <div class="plan-block-head"><span class="name">三種方案比較</span></div>
    <div class="merchant-tags">
      ${unicardPlans.map(p=>`<span class="merchant-tag">${p.name}：<strong>${p.rate}%</strong>（上限${p.cap}）</span>`).join("")}
    </div>
    <div class="meta-line" style="margin-top:8px;">基礎回饋：電子帳單+玉山帳戶自動扣繳成功＝1%無上限；僅電子帳單＝0.3%</div>
  </div>`;

  unicardCategories.forEach(c=>{
    html += `
    <div class="plan-block unicard">
      <div class="plan-block-head">
        <span class="name">${c.cat}</span>
        <span class="rate">簡單選3% / 任意選3.5% / UP選4.5%</span>
      </div>
      <div class="merchant-tags">${c.merchants.map(m=>`<span class="merchant-tag">${m}</span>`).join("")}</div>
    </div>`;
  });
  el.innerHTML = html;
}

renderRichartBrowse();
renderUnicardBrowse();

// 分頁切換
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.getAttribute('data-tab');
    document.getElementById('richartBrowse').classList.toggle('hidden', tab!=='richart');
    document.getElementById('unicardBrowse').classList.toggle('hidden', tab!=='unicard');
  });
});
</script>
