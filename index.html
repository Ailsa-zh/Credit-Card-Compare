    background:transparent;

/* ============ 建立扁平化搜尋資料（同一店家在同一張卡只出現一列，方便直接比較） ============ */
const flatRows = [];

// 台新 Richart：一個通路可能同時出現在不同方案（例如新光三越同時在 Pay著刷 與 大筆刷），皆保留為個別列
richartPlans.forEach(p=>{
  p.merchants.forEach(m=>{
    flatRows.push({
      card:"richart",
      cardName:"台新 Richart卡",
      plan:p.plan,
      rateDisplay:p.rate,
      rateNum:p.rateNum,
      cap:p.cap,
      note:p.note,
      store:m
    });
  });
});

// 玉山 Unicard：同一店家在同一分類下，三種方案合併成一列顯示（3% / 3.5% / 4.5%）
unicardCategories.forEach(c=>{
  c.merchants.forEach(m=>{
    flatRows.push({
      card:"unicard",
      cardName:"玉山 Unicard",
      plan:c.cat,
      rateDisplay:unicardRateText,
      rateNum:3.5, // 以「任意選」3.5%作為預設比較基準（免額外訂閱即可達成）
      cap:unicardCap,
      note:unicardNoteText,
      store:m
    });
  });
});

/* ============ 搜尋功能 ============ */
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultsDiv = document.getElementById('results');
const summaryLine = document.getElementById('summaryLine');
const searchResultsWrap = document.getElementById('searchResultsWrap');
const browseWrap = document.getElementById('browseWrap');

function highlight(text, q){
  if(!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0,idx) + "<mark>" + text.slice(idx, idx+q.length) + "</mark>" + text.slice(idx+q.length);
}

function renderResults(query){
  const q = query.trim();
  if(!q){
    searchResultsWrap.classList.add('hidden');
    browseWrap.classList.remove('hidden');
    return;
  }
  browseWrap.classList.add('hidden');
  searchResultsWrap.classList.remove('hidden');

  // 同時比對台新與玉山所有方案／通路
  const matches = flatRows.filter(r => r.store.toLowerCase().includes(q.toLowerCase()));

  // 去除完全重複列
  const seen = new Set();
  const unique = [];
  matches.forEach(r=>{
    const key = r.card+r.plan+r.store+r.rateDisplay;
    if(!seen.has(key)){ seen.add(key); unique.push(r); }
  });

  // 依回饋率高到低排序（台新為固定值；玉山以任意選3.5%為比較基準）
  unique.sort((a,b)=> b.rateNum - a.rateNum);

  if(unique.length === 0){
    summaryLine.innerHTML = `找不到符合「${q}」的通路，換個關鍵字試試？`;
    resultsDiv.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div>沒有找到符合的通路<br>可以試試「LINE Pay」「日本」「機票」「蝦皮」等關鍵字</div>`;
    return;
  }

  summaryLine.innerHTML = `找到 <strong>${unique.length}</strong> 筆符合「${q}」的回饋通路，已同時列出台新與玉山結果，依回饋率高到低排序：`;

  resultsDiv.innerHTML = unique.map((r,i)=>{
    const isBest = i===0;
    return `
    <div class="result-card ${r.card}">
      <div class="result-row-top">
        <span class="plan-tag ${r.card}">${r.plan}</span>
        <span class="card-badge ${r.card}"><span class="dot"></span>${r.cardName}</span>
      </div>
      <div class="result-row-main">
        <span class="rate-num">${r.rateDisplay}</span>
        <span class="store-name">${highlight(r.store,q)}</span>
        ${isBest ? '<span class="best-badge">🏆 回饋較優</span>' : ''}
      </div>
      <div class="cap-line">回饋上限：${r.cap}</div>
      <div class="meta-line">${r.note}</div>
    </div>`;
  }).join("");
}

searchInput.addEventListener('input', (e)=>{
  clearBtn.style.display = e.target.value ? 'flex' : 'none';
  renderResults(e.target.value);
});
clearBtn.addEventListener('click', ()=>{
  searchInput.value = '';
  clearBtn.style.display = 'none';
  renderResults('');
  searchInput.focus();
});

    <div class="merchant-tags">
      ${unicardPlans.map(p=>`<span class="merchant-tag">${p.name}：<strong>${p.rate}%</strong>（上限${p.cap}）</span>`).join("")}
    </div>
    <div class="meta-line" style="margin-top:8px;">基礎回饋：電子帳單+玉山帳戶自動扣繳成功＝1%無上限；僅電子帳單＝0.3%</div>
  </div>`;

  unicardCategories.forEach(c=>{

        <span class="name">${c.cat}</span>
        <span class="rate">簡單選3% / 任意選3.5% / UP選4.5%</span>
      </div>
      <div class="merchant-tags">${c.merchants.map(m=>`<span class="merchant-tag">${m}</span>`).join("")}</div>
    </div>`;
  });
  el.innerHTML = html;
}

renderRichartBrowse();
